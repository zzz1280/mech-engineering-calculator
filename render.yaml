# Render Blueprint（阶段 4）
# 用法：Render 控制台 → New → Blueprint → 选中本仓库，即可按此文件创建服务；
# 也可以不用 Blueprint，手动建 Web Service 时照抄下面的 build/start 命令。
#
# 为什么 start 用 gunicorn：Flask 内置服务器是单线程开发服务器，
# 官方明确禁止生产使用；gunicorn 是任务书技术栈里指定的生产 WSGI 服务器。
# "app:create_app()" 是应用工厂写法——gunicorn 直接调用工厂拿应用实例。
services:
  - type: web
    name: mech-engineering-calculator
    runtime: python
    plan: free                    # 免费层：512 MB 内存，闲置 15 分钟自动休眠
    buildCommand: pip install -r requirements.txt
    # Render 会注入 PORT 环境变量，必须绑定 0.0.0.0 才能被外网访问到
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 "app:create_app()"
    healthCheckPath: /            # 免费层靠这个判断部署是否成功
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      # matplotlib 首次画图要建字体缓存，指向可写目录，避免只读文件系统报错
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
